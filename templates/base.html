<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    nav { margin-bottom: 2rem; }
    nav a { margin: 0 .8rem; color: inherit; }
    .card { border: 1px solid #ccc; border-radius: 12px; padding: 2rem; margin: 1.5rem auto; max-width: 480px; font-size: 1.5rem; }
    .verso { color: #2a7; }
    button, .btn { display: inline-block; font-size: 1rem; padding: .6rem 1.2rem; margin: .3rem;
                   border: 1px solid #888; border-radius: 8px; background: #f5f5f5;
                   cursor: pointer; text-decoration: none; color: inherit; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; text-align: left; }
    th, td { padding: .4rem .6rem; border-bottom: 1px solid #ddd; }
    h2 { text-align: left; margin-bottom: .3rem; }
    .due { font-weight: bold; color: #c33; }
    .muted { color: #888; text-align: left; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Accueil</a>
    <a href="{{ url_for('boxes') }}">Boîtes</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
